name: Build
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
      - name: Build
        run: ./gradlew build
      - name: Run check
        run: ./gradlew check
      - name: Run server tests (1.8.8)
        run: ./gradlew testPlugin8
      - name: Run server tests (1.21.11)
        run: ./gradlew testPlugin21
  fabric-remap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11']
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
          cache: gradle
      - name: Compile Minecraft adapter
        run: ./gradlew :fabric-minecraft-remap:compileKotlin -PremapMinecraftVersion=${{ matrix.minecraft }}
  fabric-unobfuscated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1', '26.2']
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          cache: gradle
      - name: Compile Minecraft adapter
        run: ./gradlew :fabric-minecraft-unobfuscated:compileKotlin -PunobfuscatedMinecraftVersion=${{ matrix.minecraft }}
