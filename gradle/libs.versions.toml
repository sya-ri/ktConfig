[versions]
# Project
# Use a non-SNAPSHOT value before running the publish workflow.
ktConfig = "2.3.0-SNAPSHOT"

# README dependency examples
ktConfigBukkit = "2.2.0"
ktConfigFabric = "2.3.0"

# Plugins
kotlin = "2.4.10"
ksp = "2.3.11"
kover = "0.9.9"
kotlinter = "5.7.0"
pluginYml = "0.9.0"
minecraftServer = "4.0.2"
shadow = "9.6.1"
kotlinpoet = "2.3.0"
dokka = "2.2.0"
mavenPublish = "0.37.0"

# Libraries
spigot8 = "1.8.8-R0.1-SNAPSHOT"
spigot = "1.21.11-R0.2-SNAPSHOT"
paper = "1.21.11-R0.1-SNAPSHOT"
mockbukkit = "4.108.0"
adventure = "4.26.1"
configurate = "4.2.0"
# Configurate runtime pieces included explicitly in the Fabric README example
geantyref = "1.3.16"
option = "1.1.0"
fabricLoader = "0.18.6"
fabricLoom = "1.17.19"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
pluginYml-bukkit = { id = "de.eldoria.plugin-yml.bukkit", version.ref = "pluginYml" }
minecraftServer = { id = "dev.s7a.gradle.minecraft.server", version.ref = "minecraftServer" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
fabric-loom-remap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "fabricLoom" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabricLoom" }

[libraries]
ksp-api = { group = "com.google.devtools.ksp", name = "symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { group = "com.squareup", name = "kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { group = "com.squareup", name = "kotlinpoet-ksp", version.ref = "kotlinpoet" }
spigot8 = { group = "org.spigotmc", name = "spigot-api", version.ref = "spigot8" }
spigot = { group = "org.spigotmc", name = "spigot-api", version.ref = "spigot" }
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
mockbukkit = { group = "org.mockbukkit.mockbukkit", name = "mockbukkit-v1.21", version.ref = "mockbukkit" }
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
configurate-yaml = { group = "org.spongepowered", name = "configurate-yaml", version.ref = "configurate" }
# Fabric README include entries
configurate-core = { group = "org.spongepowered", name = "configurate-core", version.ref = "configurate" }
geantyref = { group = "io.leangen.geantyref", name = "geantyref", version.ref = "geantyref" }
option = { group = "net.kyori", name = "option", version.ref = "option" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabricLoader" }
