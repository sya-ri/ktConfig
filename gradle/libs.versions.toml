[versions]
# Plugins
kotlin = "2.3.21"
ksp = "2.3.7"
kover = "0.9.8"
kotlinter = "5.4.2"
pluginYml = "0.9.0"
minecraftServer = "4.0.2"
shadow = "9.4.1"
kotlinpoet = "2.3.0"
dokka = "2.2.0"
mavenPublish = "0.36.0"

# Libraries
spigot8 = "1.8.8-R0.1-SNAPSHOT"
spigot = "1.21.11-R0.2-SNAPSHOT"
paper = "1.21.11-R0.1-SNAPSHOT"
mockbukkit = "4.108.0"
adventure = "4.26.1"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
pluginYml-bukkit = { id = "de.eldoria.plugin-yml.bukkit", version.ref = "pluginYml" }
minecraftServer = { id = "dev.s7a.gradle.minecraft.server", version.ref = "minecraftServer" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }

[libraries]
ksp-api = { group = "com.google.devtools.ksp", name = "symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { group = "com.squareup", name = "kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { group = "com.squareup", name = "kotlinpoet-ksp", version.ref = "kotlinpoet" }
spigot8 = { group = "org.spigotmc", name = "spigot-api", version.ref = "spigot8" }
spigot = { group = "org.spigotmc", name = "spigot-api", version.ref = "spigot" }
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
mockbukkit = { group = "org.mockbukkit.mockbukkit", name = "mockbukkit-v1.21", version.ref = "mockbukkit" }
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
